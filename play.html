<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>play</title>
    <style>
        /* Подключение Arial Narrow */
        @font-face {
            font-family: 'Arial Narrow';
            src: url('111.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: black;
            color: white;
            font-family: 'Arial Narrow', Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            overflow-x: hidden;
        }
        
        /* Кнопка назад в самом верху */
        .back-btn-top {
            width: 100%;
            padding: 15px;
            text-align: right;
        }
        
        .back-btn-top img {
            width: 120px;
            height: 40px;
            cursor: pointer;
        }
        
        /* Обложка трека */
        .cover {
            width: 100vw;
            height: 60vh;
            object-fit: cover;
            display: block;
        }
        
        /* Название трека */
        .track-title {
            margin: 15px 0;
            font-size: 18px;
            text-align: center;
            padding: 0 20px;
            font-family: 'Arial Narrow', Arial, sans-serif;
        }
        
        /* Контейнер для кнопок плей/пауза/эквалайзер */
        .controls-container {
            width: 100vw;
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 0 20px;
            margin: 15px 0;
        }
        
        /* Кнопки одинаковой ширины */
        .control-btn {
            flex: 1;
            max-width: 30vw;
            height: 70px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            background-color: transparent;
            border: none;
            cursor: pointer;
        }
        
        /* Ползунок перемотки */
        .seek-container {
            width: 90vw;
            max-width: 700px;
            margin: 10px auto;
        }
        
        .seek-slider {
            width: 100%;
            height: 6px;
            -webkit-appearance: none;
            background: #666;
            outline: none;
        }
        
        .seek-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: white;
            cursor: pointer;
        }
        
        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-top: 5px;
            color: #aaa;
            font-family: 'Arial Narrow', Arial, sans-serif;
        }
        
        /* Эквалайзер панель - УПРОЩЕННЫЙ */
        .eq-panel {
            width: 95vw;
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background: #111;
            border: 1px solid #333;
            display: none;
        }
        
        /* Стили для эквалайзера - ПРОСТО ЧБ */
        .eq-slider-container {
            margin: 15px 0;
        }
        
        .eq-label {
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            color: white;
            margin-bottom: 8px;
            font-family: 'Arial Narrow', Arial, sans-serif;
        }
        
        /* ПРОСТОЙ ЧБ ползунок */
        .eq-slider {
            width: 100%;
            height: 8px;
            -webkit-appearance: none;
            background: #333;
            outline: none;
        }
        
        .eq-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: white;
            cursor: pointer;
        }
        
        /* Аудио элемент скрыт */
        #audioPlayer {
            display: none;
        }
    </style>
</head>
<body>
    <!-- Кнопка назад в самом верху -->
    <div class="back-btn-top">
        <img src="/buttons/back.png" alt="Back" id="backBtn">
    </div>
    
    <!-- Обложка трека -->
    <img src="/buttons/cover.jpg" alt="Track Cover" class="cover">
    
    <!-- Название трека -->
    <div class="track-title">
        hard by sophie (a.g.cook remix) slowed
    </div>
    
    <!-- Контейнер для кнопок управления -->
    <div class="controls-container">
        <!-- Кнопка Play -->
        <button class="control-btn" id="playBtn" 
                style="background-image: url('/buttons/play.png')">
        </button>
        
        <!-- Кнопка Pause -->
        <button class="control-btn" id="pauseBtn" 
                style="background-image: url('/buttons/pause.png')">
        </button>
        
        <!-- Кнопка EQ -->
        <button class="control-btn" id="eqBtn" 
                style="background-image: url('/buttons/eq.png')">
        </button>
    </div>
    
    <!-- Ползунок перемотки -->
    <div class="seek-container">
        <input type="range" class="seek-slider" id="seekSlider" min="0" max="100" value="0">
        <div class="time-display">
            <span id="currentTime">0:00</span>
            <span id="totalTime">0:00</span>
        </div>
    </div>
    
    <!-- Панель эквалайзера - УПРОЩЕННАЯ -->
    <div class="eq-panel" id="eqPanel">
        <!-- ПРОСТОЙ эквалайзер -->
        <div class="eq-slider-container">
            <div class="eq-label">
                <span>BASS</span>
                <span id="bassValue">0</span>
            </div>
            <input type="range" class="eq-slider" id="bassSlider" min="0" max="20" value="10">
        </div>
        
        <div class="eq-slider-container">
            <div class="eq-label">
                <span>TREBLE</span>
                <span id="trebleValue">0</span>
            </div>
            <input type="range" class="eq-slider" id="trebleSlider" min="0" max="20" value="10">
        </div>
        
        <div class="eq-slider-container">
            <div class="eq-label">
                <span>VOLUME</span>
                <span id="volumeValue">10</span>
            </div>
            <input type="range" class="eq-slider" id="volumeSlider" min="0" max="20" value="10">
        </div>
    </div>
    
    <!-- Аудио элемент -->
    <audio id="audioPlayer">
        <source src="w.mp3" type="audio/mpeg">
    </audio>
    
    <!-- Аудио для кликов -->
    <audio id="clickSound" preload="auto">
        <source src="sounds/click.mp3" type="audio/mpeg">
    </audio>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        // Элементы
        const backBtn = document.getElementById('backBtn');
        const playBtn = document.getElementById('playBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const eqBtn = document.getElementById('eqBtn');
        const eqPanel = document.getElementById('eqPanel');
        const audioPlayer = document.getElementById('audioPlayer');
        const clickSound = document.getElementById('clickSound');
        
        // Ползунки перемотки
        const seekSlider = document.getElementById('seekSlider');
        const currentTimeEl = document.getElementById('currentTime');
        const totalTimeEl = document.getElementById('totalTime');
        
        // Ползунки эквалайзера
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeValue = document.getElementById('volumeValue');
        const bassSlider = document.getElementById('bassSlider');
        const bassValue = document.getElementById('bassValue');
        const trebleSlider = document.getElementById('trebleSlider');
        const trebleValue = document.getElementById('trebleValue');
        
        // Состояние
        let isPlaying = false;
        let eqVisible = false;
        let updateSeekInterval;
        
        // Функция для воспроизведения звука клика
        function playClickSound() {
            clickSound.currentTime = 0;
            clickSound.play().catch(e => console.log('Sound error:', e));
        }
        
        // Кнопка назад - на главную
        backBtn.addEventListener('click', function() {
            playClickSound();
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 200);
        });
        
        // Форматирование времени
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }
        
        // Обновление времени трека
        function updateTimeDisplay() {
            currentTimeEl.textContent = formatTime(audioPlayer.currentTime);
            totalTimeEl.textContent = formatTime(audioPlayer.duration || 0);
            
            if (audioPlayer.duration) {
                const percent = (audioPlayer.currentTime / audioPlayer.duration) * 100;
                seekSlider.value = percent;
            }
        }
        
        // Инициализация аудио
        audioPlayer.addEventListener('loadedmetadata', function() {
            totalTimeEl.textContent = formatTime(audioPlayer.duration);
            updateTimeDisplay();
        });
        
        audioPlayer.addEventListener('timeupdate', updateTimeDisplay);
        
        // Перемотка
        seekSlider.addEventListener('input', function() {
            if (audioPlayer.duration) {
                const seekTime = (this.value / 100) * audioPlayer.duration;
                audioPlayer.currentTime = seekTime;
            }
        });
        
        // Кнопка Play
        playBtn.addEventListener('click', function() {
            playClickSound();
            audioPlayer.play();
            isPlaying = true;
            
            clearInterval(updateSeekInterval);
            updateSeekInterval = setInterval(updateTimeDisplay, 500);
        });
        
        // Кнопка Pause
        pauseBtn.addEventListener('click', function() {
            playClickSound();
            audioPlayer.pause();
            isPlaying = false;
            clearInterval(updateSeekInterval);
        });
        
        // Кнопка EQ - показать/скрыть панель эквалайзера
        eqBtn.addEventListener('click', function() {
            playClickSound();
            eqVisible = !eqVisible;
            eqPanel.style.display = eqVisible ? 'block' : 'none';
        });
        
        // Ползунок VOLUME - работает
        volumeSlider.addEventListener('input', function() {
            const value = this.value;
            volumeValue.textContent = value;
            audioPlayer.volume = value / 20;
        });
        
        // Остальные ползунки просто крутятся
        bassSlider.addEventListener('input', function() {
            bassValue.textContent = this.value;
        });
        
        trebleSlider.addEventListener('input', function() {
            trebleValue.textContent = this.value;
        });
        
        // Авто-размер кнопок
        function resizeControls() {
            const containerWidth = window.innerWidth - 70;
            const btnCount = 3;
            const gap = 15;
            const btnWidth = (containerWidth - (gap * (btnCount - 1))) / btnCount;
            
            document.querySelectorAll('.control-btn').forEach(btn => {
                btn.style.maxWidth = btnWidth + 'px';
                btn.style.height = (btnWidth * 0.8) + 'px';
            });
        }
        
        window.addEventListener('resize', resizeControls);
        resizeControls();
    });
    </script>
</body>
</html>
