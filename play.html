<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>play</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: black;
            color: white;
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            overflow-x: hidden;
        }
        
        /* Обложка трека */
        .cover {
            width: 100vw;
            height: 60vh;
            object-fit: cover;
            display: block;
        }
        
        /* Название трека */
        .track-title {
            margin: 20px 0;
            font-size: 20px;
            text-align: center;
            padding: 0 20px;
            font-weight: bold;
        }
        
        /* Контейнер для кнопок плей/пауза/эквалайзер */
        .controls-container {
            width: 100vw;
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 0 20px;
            margin: 20px 0;
        }
        
        /* Кнопки одинаковой ширины */
        .control-btn {
            flex: 1;
            max-width: 30vw;
            height: 70px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            background-color: transparent;
            border: none;
            cursor: pointer;
        }
        
        /* Ползунок перемотки */
        .seek-container {
            width: 90vw;
            max-width: 700px;
            margin: 15px auto;
        }
        
        .seek-slider {
            width: 100%;
            height: 8px;
            -webkit-appearance: none;
            background: #555;
            outline: none;
        }
        
        .seek-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: white;
            cursor: pointer;
        }
        
        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-top: 5px;
            color: #aaa;
        }
        
        /* Эквалайзер панель - ЧБ ПАЛИТРА БЕЗ СКРУГЛЕНИЙ */
        .eq-panel {
            width: 95vw;
            max-width: 800px;
            margin: 30px auto;
            padding: 25px;
            background: linear-gradient(to bottom, #000, #222); /* ЧБ градиент */
            border: 2px solid #444; /* Резкая граница */
            display: none; /* Сначала скрыт */
        }
        
        /* Стили для эквалайзера - ЧБ ПАЛИТРА */
        .eq-slider-container {
            margin: 20px 0;
        }
        
        .eq-label {
            display: flex;
            justify-content: space-between;
            font-size: 16px; /* БОЛЬШЕ */
            font-weight: bold;
            color: white; /* Белый текст */
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        
        .eq-slider {
            width: 100%;
            height: 10px;
            -webkit-appearance: none;
            background: linear-gradient(to right, #111, #666); /* ЧБ градиент */
            outline: none;
        }
        
        .eq-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            background: white; /* Белый ползунок */
            border: 2px solid #000; /* Черная обводка */
            cursor: pointer;
        }
        
        /* Рабочий ползунок VOLUME - отличается цветом */
        .volume-slider {
            background: linear-gradient(to right, #111, #888);
        }
        
        .volume-slider::-webkit-slider-thumb {
            background: #fff;
            border: 2px solid #000;
        }
        
        /* Аудио элемент скрыт */
        #audioPlayer {
            display: none;
        }
        
        /* Состояния */
        .playing {
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <!-- Обложка трека -->
    <img src="/buttons/cover.jpg" alt="Track Cover" class="cover">
    
    <!-- Название трека -->
    <div class="track-title">
        hard by sophie (a.g.cook remix) slowed
    </div>
    
    <!-- Контейнер для кнопок управления -->
    <div class="controls-container">
        <!-- Кнопка Play -->
        <button class="control-btn" id="playBtn" 
                style="background-image: url('/buttons/play.png')">
        </button>
        
        <!-- Кнопка Pause -->
        <button class="control-btn" id="pauseBtn" 
                style="background-image: url('/buttons/pause.png')">
        </button>
        
        <!-- Кнопка EQ -->
        <button class="control-btn" id="eqBtn" 
                style="background-image: url('/buttons/eq.png')">
        </button>
    </div>
    
    <!-- Ползунок перемотки -->
    <div class="seek-container">
        <input type="range" class="seek-slider" id="seekSlider" min="0" max="100" value="0">
        <div class="time-display">
            <span id="currentTime">0:00</span>
            <span id="totalTime">0:00</span>
        </div>
    </div>
    
    <!-- Панель эквалайзера - ЧБ ПАЛИТРА -->
    <div class="eq-panel" id="eqPanel">
        <!-- Много ползунков - ВСЕ КРУТЯТСЯ, только VOLUME реально работает -->
        <div class="eq-slider-container">
            <div class="eq-label">
                <span>BASS</span>
                <span id="bassValue">0db</span>
            </div>
            <input type="range" class="eq-slider" id="bassSlider" min="-12" max="12" value="0">
        </div>
        
        <div class="eq-slider-container">
            <div class="eq-label">
                <span>MID</span>
                <span id="midValue">0db</span>
            </div>
            <input type="range" class="eq-slider" id="midSlider" min="-12" max="12" value="0">
        </div>
        
        <div class="eq-slider-container">
            <div class="eq-label">
                <span>TREBLE</span>
                <span id="trebleValue">0db</span>
            </div>
            <input type="range" class="eq-slider" id="trebleSlider" min="-12" max="12" value="0">
        </div>
        
        <div class="eq-slider-container">
            <div class="eq-label">
                <span>LOW</span>
                <span id="lowValue">0db</span>
            </div>
            <input type="range" class="eq-slider" id="lowSlider" min="-12" max="12" value="0">
        </div>
        
        <div class="eq-slider-container">
            <div class="eq-label">
                <span>HIGH</span>
                <span id="highValue">0db</span>
            </div>
            <input type="range" class="eq-slider" id="highSlider" min="-12" max="12" value="0">
        </div>
        
        <div class="eq-slider-container">
            <div class="eq-label">
                <span>GAIN</span>
                <span id="gainValue">0db</span>
            </div>
            <input type="range" class="eq-slider" id="gainSlider" min="-12" max="12" value="0">
        </div>
        
        <!-- Единственный рабочий ползунок VOLUME -->
        <div class="eq-slider-container">
            <div class="eq-label">
                <span>VOLUME</span>
                <span id="volumeValue">50%</span>
            </div>
            <input type="range" class="eq-slider volume-slider" id="volumeSlider" min="0" max="100" value="50">
        </div>
        
        <!-- ЕЩЕ нерабочие но крутящиеся ползунки -->
        <div class="eq-slider-container">
            <div class="eq-label">
                <span>FX</span>
                <span id="fxValue">off</span>
            </div>
            <input type="range" class="eq-slider" id="fxSlider" min="0" max="10" value="0">
        </div>
        
        <div class="eq-slider-container">
            <div class="eq-label">
                <span>REVERB</span>
                <span id="reverbValue">0%</span>
            </div>
            <input type="range" class="eq-slider" id="reverbSlider" min="0" max="100" value="0">
        </div>
        
        <div class="eq-slider-container">
            <div class="eq-label">
                <span>DELAY</span>
                <span id="delayValue">0ms</span>
            </div>
            <input type="range" class="eq-slider" id="delaySlider" min="0" max="500" value="0">
        </div>
    </div>
    
    <!-- Аудио элемент -->
    <audio id="audioPlayer">
        <source src="w.mp3" type="audio/mpeg">
    </audio>
    
    <!-- Аудио для кликов -->
    <audio id="clickSound" preload="auto">
        <source src="sounds/click.mp3" type="audio/mpeg">
    </audio>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        // Элементы
        const playBtn = document.getElementById('playBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const eqBtn = document.getElementById('eqBtn');
        const eqPanel = document.getElementById('eqPanel');
        const audioPlayer = document.getElementById('audioPlayer');
        const clickSound = document.getElementById('clickSound');
        
        // Ползунки перемотки
        const seekSlider = document.getElementById('seekSlider');
        const currentTimeEl = document.getElementById('currentTime');
        const totalTimeEl = document.getElementById('totalTime');
        
        // Ползунки эквалайзера
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeValue = document.getElementById('volumeValue');
        
        const bassSlider = document.getElementById('bassSlider');
        const bassValue = document.getElementById('bassValue');
        const midSlider = document.getElementById('midSlider');
        const midValue = document.getElementById('midValue');
        const trebleSlider = document.getElementById('trebleSlider');
        const trebleValue = document.getElementById('trebleValue');
        const lowSlider = document.getElementById('lowSlider');
        const lowValue = document.getElementById('lowValue');
        const highSlider = document.getElementById('highSlider');
        const highValue = document.getElementById('highValue');
        const gainSlider = document.getElementById('gainSlider');
        const gainValue = document.getElementById('gainValue');
        const fxSlider = document.getElementById('fxSlider');
        const fxValue = document.getElementById('fxValue');
        const reverbSlider = document.getElementById('reverbSlider');
        const reverbValue = document.getElementById('reverbValue');
        const delaySlider = document.getElementById('delaySlider');
        const delayValue = document.getElementById('delayValue');
        
        // Состояние
        let isPlaying = false;
        let eqVisible = false;
        let updateSeekInterval;
        
        // Функция для воспроизведения звука клика
        function playClickSound() {
            clickSound.currentTime = 0;
            clickSound.play().catch(e => console.log('Sound error:', e));
        }
        
        // Форматирование времени
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }
        
        // Обновление времени трека
        function updateTimeDisplay() {
            currentTimeEl.textContent = formatTime(audioPlayer.currentTime);
            totalTimeEl.textContent = formatTime(audioPlayer.duration || 0);
            
            if (audioPlayer.duration) {
                const percent = (audioPlayer.currentTime / audioPlayer.duration) * 100;
                seekSlider.value = percent;
            }
        }
        
        // Инициализация аудио
        audioPlayer.addEventListener('loadedmetadata', function() {
            totalTimeEl.textContent = formatTime(audioPlayer.duration);
            updateTimeDisplay();
        });
        
        audioPlayer.addEventListener('timeupdate', updateTimeDisplay);
        
        // Перемотка
        seekSlider.addEventListener('input', function() {
            if (audioPlayer.duration) {
                const seekTime = (this.value / 100) * audioPlayer.duration;
                audioPlayer.currentTime = seekTime;
            }
        });
        
        // Кнопка Play
        playBtn.addEventListener('click', function() {
            playClickSound();
            audioPlayer.play();
            isPlaying = true;
            playBtn.classList.add('playing');
            pauseBtn.classList.remove('playing');
            
            // Запуск обновления ползунка
            clearInterval(updateSeekInterval);
            updateSeekInterval = setInterval(updateTimeDisplay, 500);
        });
        
        // Кнопка Pause
        pauseBtn.addEventListener('click', function() {
            playClickSound();
            audioPlayer.pause();
            isPlaying = false;
            pauseBtn.classList.add('playing');
            playBtn.classList.remove('playing');
            clearInterval(updateSeekInterval);
        });
        
        // Кнопка EQ - показать/скрыть панель эквалайзера
        eqBtn.addEventListener('click', function() {
            playClickSound();
            eqVisible = !eqVisible;
            eqPanel.style.display = eqVisible ? 'block' : 'none';
        });
        
        // Единственный рабочий ползунок - VOLUME
        volumeSlider.addEventListener('input', function() {
            const value = this.value;
            volumeValue.textContent = value + '%';
            audioPlayer.volume = value / 100;
        });
        
        // Все ползунки КРУТЯТСЯ, но только VOLUME реально работает
        // Ползунки просто меняют значения на экране
        bassSlider.addEventListener('input', function() {
            bassValue.textContent = this.value + 'db';
        });
        
        midSlider.addEventListener('input', function() {
            midValue.textContent = this.value + 'db';
        });
        
        trebleSlider.addEventListener('input', function() {
            trebleValue.textContent = this.value + 'db';
        });
        
        lowSlider.addEventListener('input', function() {
            lowValue.textContent = this.value + 'db';
        });
        
        highSlider.addEventListener('input', function() {
            highValue.textContent = this.value + 'db';
        });
        
        gainSlider.addEventListener('input', function() {
            gainValue.textContent = this.value + 'db';
        });
        
        fxSlider.addEventListener('input', function() {
            const val = this.value;
            fxValue.textContent = val === '0' ? 'off' : val;
        });
        
        reverbSlider.addEventListener('input', function() {
            reverbValue.textContent = this.value + '%';
        });
        
        delaySlider.addEventListener('input', function() {
            delayValue.textContent = this.value + 'ms';
        });
        
        // Авто-размер кнопок под ширину экрана
        function resizeControls() {
            const containerWidth = window.innerWidth - 70; // минус padding и gap
            const btnCount = 3;
            const gap = 15;
            const btnWidth = (containerWidth - (gap * (btnCount - 1))) / btnCount;
            
            document.querySelectorAll('.control-btn').forEach(btn => {
                btn.style.maxWidth = btnWidth + 'px';
                btn.style.height = (btnWidth * 0.8) + 'px';
            });
        }
        
        // Ресайз при изменении размера окна
        window.addEventListener('resize', resizeControls);
        resizeControls();
    });
    </script>
</body>
</html>
