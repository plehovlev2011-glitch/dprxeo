<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body class="b">
    <div class="viewport">
        <img src="_assets/01.jpg" alt="Background 1">
        <img src="_assets/02.jpg" alt="Background 2" style="display:none;">

        <div class="pages">
            <div class="page a">
                <center>
                    <!-- Добавляем ссылку на текст "young n stupid" -->

                        <p style="cursor: pointer;">
                          GOD-SENT DESIGNER
                            <br>!
                        </p>
                    </a>
                </center>
            </div>

            <!-- Вторая страница с кнопками -->
            <div class="page">
                <center>
                    <div class="buttons-container" id="png-buttons">
                        <!-- Большие кнопки одинаковой ширины без отступов -->
                        <a href="https://t.me/dementiapraecox1" target="_blank" 
                           style="display: block; width: 280px; height: 80px; margin: 0 0 5px 0; background-image: url('/buttons/tg.png'); background-size: 100% 100%; background-repeat: no-repeat; background-position: center;">
                        </a>
                        
                        <a href="https://www.instagram.com/meh88949?utm_source=qr" target="_blank" 
                           style="display: block; width: 280px; height: 80px; margin: 0 0 5px 0; background-image: url('/buttons/inst.png'); background-size: 100% 100%; background-repeat: no-repeat; background-position: center;">
                        </a>
                        
                        <a href="https://dprxeo.vercel.app/me.html" target="_blank" 
                           style="display: block; width: 280px; height: 80px; margin: 0; background-image: url('/buttons/justweb.png'); background-size: 100% 100%; background-repeat: no-repeat; background-position: center;">
                        </a>
                    </div>
                </center>
            </div>
        </div>
    </div>

    <!-- Создаем аудио элементы для всех случайных звуков -->
    <div id="audio-container" style="display:none;">
        <audio id="btnFX1" preload="auto">
            <source src="/buttonFXs/btnFX1.mp3" type="audio/mpeg">
        </audio>
        <audio id="btnFX2" preload="auto">
            <source src="/buttonFXs/btnFX2.mp3" type="audio/mpeg">
        </audio>
        <audio id="btnFX3" preload="auto">
            <source src="/buttonFXs/btnFX3.mp3" type="audio/mpeg">
        </audio>
        <audio id="btnFX4" preload="auto">
            <source src="/buttonFXs/btnFX4.mp3" type="audio/mpeg">
        </audio>
        <audio id="btnFX5" preload="auto">
            <source src="/buttonFXs/btnFX5.mp3" type="audio/mpeg">
        </audio>
        <audio id="btnFX6" preload="auto">
            <source src="/buttonFXs/btnFX6.mp3" type="audio/mpeg">
        </audio>
        <audio id="btnFX7" preload="auto">
            <source src="/buttonFXs/btnFX7.mp3" type="audio/mpeg">
        </audio>
        <audio id="btnFX8" preload="auto">
            <source src="/buttonFXs/btnFX8.mp3" type="audio/mpeg">
        </audio>
        <audio id="btnFX9" preload="auto">
            <source src="/buttonFXs/btnFX9.mp3" type="audio/mpeg">
        </audio>
        <audio id="btnFX10" preload="auto">
            <source src="/buttonFXs/btnFX10.mp3" type="audio/mpeg">
        </audio>
        <audio id="btnFX11" preload="auto">
            <source src="/buttonFXs/btnFX11.mp3" type="audio/mpeg">
        </audio>
    </div>

    <script>
    $(document).ready(function(){
        // Функция для воспроизведения случайного звука
        function playRandomButtonSound() {
            // Список всех доступных звуков кнопок
            var sounds = [
                'btnFX1', 'btnFX2', 'btnFX3', 'btnFX4', 'btnFX5',
                'btnFX6', 'btnFX7', 'btnFX8', 'btnFX9', 'btnFX10', 'btnFX11'
            ];
            
            // Выбираем случайный звук
            var randomSoundId = sounds[Math.floor(Math.random() * sounds.length)];
            
            // Находим аудио элемент
            var audioElement = document.getElementById(randomSoundId);
            
            if (audioElement) {
                // Сбрасываем на начало и воспроизводим
                audioElement.currentTime = 0;
                audioElement.play().catch(function(error) {
                    console.log('Ошибка воспроизведения звука:', error);
                    // Если один звук не работает, пробуем другой
                    var otherSounds = sounds.filter(s => s !== randomSoundId);
                    if (otherSounds.length > 0) {
                        var fallbackSoundId = otherSounds[Math.floor(Math.random() * otherSounds.length)];
                        var fallbackAudio = document.getElementById(fallbackSoundId);
                        if (fallbackAudio) {
                            fallbackAudio.currentTime = 0;
                            fallbackAudio.play().catch(e => console.log('Fallback тоже не работает:', e));
                        }
                    }
                });
            }
        }
        
        // Звук клика для всех больших кнопок
        $('#png-buttons a').on('click', function(e){
            e.preventDefault();
            var href = $(this).attr('href');
            
            // Воспроизводим случайный звук вместо стандартного
            playRandomButtonSound();
            
            // Переход через 300мс
            setTimeout(function(){
                window.open(href, '_blank');
            }, 300);
        });
        
        // Звук клика для текста "young n stupid" и переход на play.html
        $('center a[href="play.html"]').on('click', function(e){
            e.preventDefault();
            
            // Воспроизводим случайный звук вместо стандартного
            playRandomButtonSound();
            
            // Переход через 300мс
            setTimeout(function(){
                window.location.href = 'play.html';
            }, 300);
        });
        
        // Убедимся что картинки загружаются
        setTimeout(function(){
            $('#png-buttons a').each(function(){
                var bg = $(this).css('background-image');
                if(!bg || bg === 'none') {
                    // Если не загрузилось, пробуем напрямую img
                    var href = $(this).attr('href');
                    var src = bg.match(/url\(['"]?(.*?)['"]?\)/);
                    if(src && src[1]) {
                        $(this).html('<img src="' + src[1] + '" style="width:280px;height:80px;">');
                    }
                }
            });
        }, 1000);
        
        // Предзагрузка звуков для уменьшения задержки
        setTimeout(function() {
            var soundIds = ['btnFX1', 'btnFX2', 'btnFX3', 'btnFX4', 'btnFX5', 
                           'btnFX6', 'btnFX7', 'btnFX8', 'btnFX9', 'btnFX10', 'btnFX11'];
            soundIds.forEach(function(id) {
                var audio = document.getElementById(id);
                if (audio) {
                    audio.load();
                }
            });
        }, 1000);
    });
    </script>
    
    <script src="scripts.js"></script>
</body>
</html>
