<body class="b">

        <img src="_assets/01.jpg" alt="Background 1">
        <img src="_assets/02.jpg" alt="Background 2" style="display:none;">

        <div class="pages">
            <div class="page a">
                <center>
                    <p>
                        i don't think i exist anymore

                </center>
            </div>

            <!-- Вторая страница с кнопками -->
            <div class="page">
                <center>
                    <div class="buttons-container" id="png-buttons">
                        <!-- Пробуем base64 кодировку или прямая загрузка -->
                        <div style="display: flex; flex-direction: column; gap: 20px; align-items: center;">
                            <!-- Вариант 1: Прямые div с background-image -->
                            <a href="https://t.me/dementiapraecox1" target="_blank" 
                               class="png-button" 
                               style="background-image: url('/buttons/tg.png');">
                            </a>
                            
                            <a href="https://www.instagram.com/meh88949?utm_source=qr" target="_blank" 
                               class="png-button"
                               style="background-image: url('/buttons/inst.png');">
                            </a>
                            
                            <a href="https://dprxeo.vercel.app/me.html" target="_blank" 
                               class="png-button"
                               style="background-image: url('/buttons/justweb.png');">
                            </a>
                            
                            <!-- Вариант 2: Резервный - обычные картинки -->
                            <div style="display: none;" id="fallback">
                                <a href="https://t.me/dementiapraecox1" target="_blank">
                                    <img src="/buttons/tg.png" alt="tg" onerror="this.style.display='none'">
                                </a>
                                <a href="https://www.instagram.com/meh88949?utm_source=qr" target="_blank">
                                    <img src="/buttons/inst.png" alt="inst" onerror="this.style.display='none'">
                                </a>
                                <a href="https://dprxeo.vercel.app/me.html" target="_blank">

                                </a>
                            </div>
                        </div>
                    </div>
                </center>
            </div>
        </div>

    <!-- Аудио для клика -->
    <audio id="clickSound" preload="auto">
        <source src="sounds/click.mp3" type="audio/mpeg">
    </audio>

    <script>
    $(document).ready(function(){
        // Стили для кнопок с background-image
        $('.png-button').each(function(){
            $(this).css({
                'display': 'block',
                'width': '180px',
                'height': '45px',
                'background-size': 'contain',
                'background-repeat': 'no-repeat',
                'background-position': 'center',
                'margin': '10px 0',
                'border': 'none',
                'cursor': 'pointer'
            });
        });
        
        // Звук клика
        $('.png-button').on('click', function(e){
            e.preventDefault();
            var href = $(this).attr('href');
            
            $('#clickSound')[0].currentTime = 0;
            $('#clickSound')[0].play();
            
            setTimeout(function(){
                window.open(href, '_blank');
            }, 300);
        });
        
        // Проверяем загрузились ли картинки через 2 секунды
        setTimeout(function(){
            if($('.png-button').filter(function(){
                return $(this).css('background-image') === 'none' || 
                       $(this).css('background-image').indexOf('url') === -1;
            }).length > 0) {
                // Показываем резервный вариант
                $('#fallback').show();
                $('.png-button').hide();
                
                // Назначаем звук на резервные кнопки
                $('#fallback a').on('click', function(e){
                    e.preventDefault();
                    var href = $(this).attr('href');
                    
                    $('#clickSound')[0].currentTime = 0;
                    $('#clickSound')[0].play();
                    
                    setTimeout(function(){
                        window.open(href, '_blank');
                    }, 300);
                });
            }
        }, 2000);
    });
    </script>
    
    <script src="scripts.js"></script>
</body>
